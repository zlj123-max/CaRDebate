project:
  project_dir: 
  data_root: 

environment:
  conda_env: /root/miniforge3/envs/CaRDebate
  vllm_env: /root/miniforge3/envs/vllm
  cuda_home: /usr/local/cuda-12.8

model_server:
  model_server_root: /CaRDebate/model_server
  model_server_log: /CaRDebate/model_server/logs
  model_server_pid: /CaRDebate/model_server/pids

dataset:
  name: harmbench
  path: /datasets/HarmBench/data/behavior_datasets/harmbench_behaviors_text_all.csv
