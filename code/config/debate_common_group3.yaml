router:
  host: 127.0.0.1
  port: 8030
  api_key: local
  remote_base_url: https://api.openai-proxy.org/v1

models:
  agent1:
    display_name: Agent1
    model_path: /data/models/CohereLabs/c4ai-command-r7b-12-2024
    served_name: agent1
    gpu: 0
    port: 8031
    gpu_memory_utilization: 0.90
    max_model_len: 16438

  agent2:
    display_name: Agent2
    model_path: /data/models/zai-org/glm-4-9b-chat-hf
    served_name: agent2
    gpu: 1
    port: 8032
    gpu_memory_utilization: 0.90
    max_model_len: 16438

  agent3:
    display_name: Agent3
    model_path: /data/models/internlm/internlm3-8b-instruct
    served_name: agent3
    gpu: 2
    port: 8033
    gpu_memory_utilization: 0.90
    max_model_len: 16438
    
  evaluator:
    display_name: Evaluator
    model_path: /data/models/meta-llama/Llama-Guard-3-8B
    served_name: evaluator
    gpu: 3
    port: 8034
    gpu_memory_utilization: 0.90
    max_model_len: 8192

remote_models:
  feedback:
    served_name: gpt-4o-mini

model_output_files:
  agent1: c4ai-command-r7b-12-2024.jsonl
  agent2: glm-4-9b-chat-hf.jsonl
  agent3: internlm3-8b-instruct.jsonl
  evaluator: llama-guard-3-8b.jsonl
